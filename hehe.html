<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blue & Yellow Aesthetic</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f4c81, #1e90ff);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #ffdd57;
      color: #0f4c81;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background: #0f4c81;
      color: #ffdd57;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1e90ff;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello ☀️</h1>
    <p>blue and yellow are my fav colours</p>
    <button>Explore</button>
  </div>

</body>
</html>
