<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiera's Aesthetic Page</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #6ec6ff, #1e3c72);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* floating circles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    animation: float 10s infinite ease-in-out;
  }

  .bubble:nth-child(1) {
    width: 120px; height: 120px;
    background: #ffe066;
    top: 10%; left: 20%;
  }

  .bubble:nth-child(2) {
    width: 80px; height: 80px;
    background: #fff3b0;
    bottom: 15%; right: 25%;
    animation-delay: 2s;
  }

  .bubble:nth-child(3) {
    width: 60px; height: 60px;
    background: #ffd43b;
    top: 70%; left: 10%;
    animation-delay: 4s;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
  }

  /* main card */
  .card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    width: 340px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 10px;
    color: #ffe066;
    text-shadow: 0 0 10px rgba(255,224,102,0.8);
  }

  p {
    font-size: 14px;
    opacity: 0.85;
  }

  .btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, #ffe066, #ffd43b);
    color: #1e3c72;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(255, 212, 59, 0.4);
  }

  .btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 25px rgba(255, 212, 59, 0.7);
  }

  .footer {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.7;
  }

</style>
</head>

<body>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="card">
  <h1>✨ Kiera ✨</h1>
  <p>Soft vibes, golden sunshine, and dreamy blue skies 💙💛</p>
  <button class="btn">Enter</button>
  <div class="footer">made with aesthetic energy ✿</div>
</div>

</body>
</html>
